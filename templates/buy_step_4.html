    <body>
        <div class="container-fluid">
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="row">
                    <div class="col">
                        <img src="https://static.lenskart.com/media/desktop/img/DesignStudioIcons/Shield.svg">&nbsp 100% safe and secure
                    </div>
                </div><br>
            </nav><br>
        </div>

        <div class="container-fluid"  style="background-color: white;">
        <div class="container">
            <div class="row">

                <div class="row" style="background-color:rgb(222, 253, 252);">
                    <p><a1 style="color:blue;">&nbsp&nbsp Shipping Address &nbsp&nbsp </a1>> &nbsp&nbsp Payment &nbsp&nbsp </p>
                </div><br>

                <div class="col-sm-6"><br>
                     <form action="../shippingcode/" method="post" enctype="multipart/form-data">
                  {% csrf_token %}
                    <p style="font-size: 28px;">Save Address</p><br>

                       <input type="hidden" name="cartid" value="{{result.id }}"/>
                         <input type="hidden" name="price" value="{{ result.price}}"/>
                        <div class="row">
                            <div class="col">
                                <input type="name" name="firstname" class="form-control" id="validationDefault01" placeholder="First Name"aria-describedby="nameHelp" required>
                            </div>
                            <div class="col">
                                <input type="name" name="lastname" class="form-control" placeholder="Last Name"id="validationDefault02" aria-describedby="nameHelp" required>
                            </div>
                        </div><br><br>


                        <div class="row">
                            <div class="col">
                                <input type="text" name="number" class="form-control" placeholder=" Phone Number" id="validationDefault06" aria-describedby="numberHelp" required>
                            </div>
                            <div class="col">
                                <input type="email" name="email" class="form-control" placeholder="Email Address" id="validationDefault07" aria-describedby="emailHelp" required>
                            </div>
                        </div><br>

                        <div class="row">
                            <div class="col">
                                <input type="text" name="address" class="form-control" placeholder="Address" id="validationDefault08" aria-describedby="addressHelp" required>
                            </div>
                        </div><br>

                        <div class="row">
                            <div class="col">
                                <input type="text" name="pincode" class="form-control" placeholder="Pincode" id="validationDefault10" aria-describedby="numberHelp" required>
                            </div>
                            <div class="col">
                                <input type="text" name="city" class="form-control" placeholder="City/District" id="validationDefault11" aria-describedby="cityHelp" required>
                            </div>
                        </div><br>

                        <div class="row">
                            <div class="col">
                                <input type="text" name="state" class="form-control" placeholder="Select State" id="validationDefault12" aria-describedby="stateHelp" required>
                            </div>
                            <div class="col">
                                <input type="text" name="country" class="form-control" placeholder="Country" id="validationDefault13" aria-describedby="countryHelp" required>
                            </div>
                        </div><br>

                         <div class="row">
                            <div class="col-sm-4">
                                <div class="d-flex flex-wrap gap-2">
                                    <button class="btn btn-primary waves-effect waves-light">Save</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>

            <div class="col-sm-6"><br><br>
